name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，新的推送取代排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 先把 CI 的校验（typecheck / lint / format / 测试）跑一遍，通过了才允许发布。
  # 打包器的验证交给下面的 build job —— 它用 BASE_PATH 构建的正是要发布的产物
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      # 下面的 build job 马上会用 BASE_PATH 再构建一次，这里不必重复
      skip-build: true

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Node 版本的唯一来源是 .nvmrc
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages 项目页部署在 /<repo>/ 子路径下
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement: 仓库尚未开启 Pages 时自动开启并把来源设为 GitHub Actions。
      # 没有它，首次部署会以「Get Pages site failed ... Not Found」失败 ——
      # 必须先手动到 Settings → Pages 里选一次来源才能跑通。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
