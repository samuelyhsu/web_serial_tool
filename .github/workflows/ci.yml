name: CI

on:
  pull_request:
  # 供 deploy.yml / release.yml 调用：校验作为发布的前置关卡跑，
  # 而不是和发布并行 —— 并行的话测试挂了照样会发出去
  workflow_call:
    inputs:
      skip-build:
        description: >-
          调用方自己会做一次生产构建时传 true，避免同一条流水线把 vite build 跑两遍。
          只影响 workflow_call；PR 触发时构建始终执行 ——
          PR 上没有别的地方会跑打包器，这一步不能丢。
        type: boolean
        default: false

# 默认令牌权限是仓库级配置，很多仓库是读写全开。这里显式收到只读：
# 这条流水线不需要写任何东西，一旦某个依赖或 action 被投毒，能做的事就少得多。
permissions:
  contents: read

# 同一分支/PR 上新的推送取代排队中的旧任务。
# event_name 参与分组：被 deploy / release 调用时（push / tag）与 PR 触发互不干扰。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 版本的唯一来源是 .nvmrc，本地 `nvm use` 与 CI 拿到的是同一个
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        # 测试挂了时的覆盖率报告同样有用，所以不加 success() 条件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # 被 deploy.yml 调用时跳过：那条流水线紧接着就会用 BASE_PATH 做一次真正的
      # 生产构建，同样能验证打包器，重复构建只是白等。
      # 条件里显式写出 pull_request，不依赖「inputs 为空时 null 强转 false」这条
      # 隐晦规则 —— 万一理解有偏差，PR 会静默失去打包器验证，这种漏洞没人会察觉。
      - name: Build
        if: ${{ github.event_name == 'pull_request' || !inputs.skip-build }}
        run: npm run build

      # 扩展的宿主代码与 webview 各自打一次，顺带把 VSIX 也打出来。
      # 打包这一步是唯一能发现「core 改动把宿主侧弄坏了」的关卡，而 package 这一步
      # 还会跑 VSIX 内容断言（图标、文案、许可证、预编译产物在不在，源码有没有混进去）。
      - name: Package VS Code extension
        run: npm run package:vscode

      # 正式发布之前，这是唯一能让人试用扩展的途径：从 PR 的 Artifacts 里下载安装。
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apps/vscode/*.vsix
          retention-days: 14
          if-no-files-found: error

  # 单独一个 job：它要下载一整份 VS Code 并起图形环境，比上面那串慢得多，
  # 不该拖住快速校验。它专攻单元测试够不着的那一段 —— 扩展装进去之后好不好使
  # （能不能激活、命令注册没有、面板建不建得出来）。
  # 依赖真实串口的用例在 CI 上会自动跳过：这里没有任何串口设备。
  vscode-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 不缓存的话每次都要重下一整份 VS Code（约 150MB），是这个 job 最大的时间开销。
      # key 里带 stable：.vscode-test.mjs 里指定的就是它，换成固定版本号时记得同步。
      - name: Cache VS Code for integration tests
        uses: actions/cache@v6
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-stable

      # VS Code 是 Electron 应用，没有显示服务就起不来
      - name: Integration tests
        run: xvfb-run -a npm --prefix apps/vscode run test:integration
