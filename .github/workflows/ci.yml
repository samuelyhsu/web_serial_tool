name: CI

on:
  pull_request:
  # 供 deploy.yml 调用：main 分支的校验作为部署的前置关卡跑，
  # 而不是和部署并行 —— 并行的话测试挂了照样会发布上线
  workflow_call:
    inputs:
      skip-build:
        description: >-
          调用方自己会做一次生产构建时传 true，避免同一条流水线把 vite build 跑两遍。
          只影响 workflow_call；PR 触发时构建始终执行 ——
          PR 上没有别的地方会跑打包器，这一步不能丢。
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      # 被 deploy.yml 调用时跳过：那条流水线紧接着就会用 BASE_PATH 做一次真正的
      # 生产构建，同样能验证打包器，重复构建只是白等。
      # 条件里显式写出 pull_request，不依赖「inputs 为空时 null 强转 false」这条
      # 隐晦规则 —— 万一理解有偏差，PR 会静默失去打包器验证，这种漏洞没人会察觉。
      - name: Build
        if: ${{ github.event_name == 'pull_request' || !inputs.skip-build }}
        run: npm run build

      # 扩展的宿主代码与 webview 各自打一次。它和 Web 版共用 src/core，
      # 打包这一步是唯一能发现「core 改动把宿主侧弄坏了」的关卡。
      - name: Build VS Code extension
        run: npm run build:vscode

  # 单独一个 job：它要下载一整份 VS Code 并起图形环境，比上面那串慢得多，
  # 不该拖住快速校验。它专攻单元测试够不着的那一段 —— 扩展装进去之后好不好使
  # （能不能激活、命令注册没有、面板建不建得出来）。
  # 依赖真实串口的用例在 CI 上会自动跳过：这里没有任何串口设备。
  vscode-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VS Code 是 Electron 应用，没有显示服务就起不来
      - name: Integration tests
        run: xvfb-run -a npm --prefix apps/vscode run test:integration
