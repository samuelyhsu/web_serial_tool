# serial.uplume.com —— 自建部署的 nginx 站点配置
#
# 装法见同目录的 README.md。
#
# 关键约束：**必须是 https**。Web Serial API 只在安全上下文下可用，
# 纯 http 的站点上 navigator.serial 根本不存在，页面会显示「浏览器不支持」横幅。

server {
    listen 80;
    listen [::]:80;
    server_name serial.uplume.com;

    # certbot 会往这里插 ACME 挑战用的 location，放在重定向之前。
    # 其余一律跳 https。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name serial.uplume.com;

    ssl_certificate     /etc/letsencrypt/live/serial.uplume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serial.uplume.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/serial.uplume.com;
    index index.html;

    # 这个站点没有任何走 http 的理由（走了也用不了），直接上 HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 下面两个 location 只用 expires、**不用 add_header**，是有意的：
    # nginx 的 add_header 不会叠加而是**整组覆盖** —— 子 location 里只要出现一条
    # add_header，上面那三条安全头就会在该 location 下全部消失。
    # expires 不是 add_header，因此安全头能正常继承下来。

    # 带内容哈希的资源，文件名变了才会变内容，可以长期缓存
    location /assets/ {
        expires 1y;
    }

    # index.html 绝不能缓存：它引用的是带哈希的文件名，
    # 缓存住就意味着用户永远停在旧版本上
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
