name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，新的推送取代排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 先把 CI 的校验（typecheck / lint / format / 测试）跑一遍，通过了才允许发布。
  # 打包器的验证交给下面的 build job —— 它用 BASE_PATH 构建的正是要发布的产物
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      # 下面的 build job 马上会用 BASE_PATH 再构建一次，这里不必重复
      skip-build: true

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 版本的唯一来源是 .nvmrc
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages 项目页部署在 /<repo>/ 子路径下
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement: 仓库尚未开启 Pages 时自动开启并把来源设为 GitHub Actions。
      # 没有它，首次部署会以「Get Pages site failed ... Not Found」失败 ——
      # 必须先手动到 Settings → Pages 里选一次来源才能跑通。
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 同一份代码再部署一份到自建服务器（serial.uplume.com）。
  #
  # 与 Pages 那份的唯一区别是 base 路径：自有域名就是站点根，不需要 /<repo>/ 前缀，
  # 所以这里用默认构建，不传 BASE_PATH。
  #
  # 主机 / 端口 / 用户都走 secrets 而不是写死在文件里：仓库是公开的，
  # 非标准 SSH 端口没必要主动登出去。没配密钥时整个 job 静默跳过，
  # fork 这个仓库的人不会因此一直看到红叉。
  self-hosted:
    needs: verify
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7
        if: env.SSH_KEY != ''

      - uses: actions/setup-node@v7
        if: env.SSH_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: env.SSH_KEY != ''

      - name: Build
        if: env.SSH_KEY != ''
        run: npm run build

      # 不用第三方的 ssh-agent action：这点事几行 shell 就够，
      # 而部署密钥要经手的东西越少越好。
      - name: Deploy
        if: env.SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 用固定的 known_hosts 校验主机指纹，而不是 StrictHostKeyChecking=no ——
          # 后者等于对中间人完全不设防
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delete 清掉上一版留下的、带旧哈希的资源文件
          rsync -az --delete --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Skipped
        if: env.SSH_KEY == ''
        run: echo "::notice::未配置 SSH_KEY，已跳过自建服务器部署。"
