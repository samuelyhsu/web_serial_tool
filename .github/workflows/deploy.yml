name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，新的推送取代排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 先把 CI 的全套校验（typecheck / lint / format / 测试 / 构建）跑一遍，
  # 通过了才允许构建产物并发布
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # GitHub Pages 项目页部署在 /<repo>/ 子路径下
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # enablement: 仓库尚未开启 Pages 时自动开启并把来源设为 GitHub Actions。
      # 没有它，首次部署会以「Get Pages site failed ... Not Found」失败 ——
      # 必须先手动到 Settings → Pages 里选一次来源才能跑通。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
